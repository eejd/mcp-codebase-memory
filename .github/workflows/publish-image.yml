name: Publish image

# ghcr publish for hive container consumption (hive-ecosystem#15 — the compose
# reference must be digest-pinned per ADR-0007 §2, so :latest is a convenience
# tag only; consumers pin the manifest digest).
# Multi-arch: the hive deploy target is an arm64 Colima VM; amd64 kept for
# CI/runner parity.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eejd/codebase-memory-mcp:latest
            ghcr.io/eejd/codebase-memory-mcp:${{ github.sha }}
